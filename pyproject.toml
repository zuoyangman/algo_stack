[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algo_stack"
version = "0.1.0"
description = "From-scratch ML/data-science algorithms with paired docs (README/PRINCIPLE/EXTENSION)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "algo_stack contributors" }]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["algo_stack*"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
